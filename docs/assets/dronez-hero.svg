<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DroneZ hybrid drone fleet control tower</title>
  <desc id="desc">A cinematic city-control visualization with a drone, route corridors, telemetry cards, and a hybrid AI control tower.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF7FF"/>
      <stop offset="0.48" stop-color="#DFF5EC"/>
      <stop offset="1" stop-color="#F9E9C7"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#EAF2F6" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="route" x1="214" y1="298" x2="1015" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F80ED"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#00A878"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0C2E3E" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="34" fill="url(#sky)"/>
  <circle cx="1057" cy="76" r="72" fill="#FFD166" opacity="0.55"/>
  <circle cx="1061" cy="78" r="40" fill="#FFE8A3" opacity="0.75"/>
  <path d="M70 340 C180 280 277 306 386 255 C523 190 617 238 741 174 C865 110 980 161 1130 85" stroke="url(#route)" stroke-width="9" stroke-linecap="round" stroke-dasharray="22 16" opacity="0.8" filter="url(#softGlow)"/>
  <path d="M70 366 H1130" stroke="#233647" stroke-width="2" opacity="0.12"/>
  <g opacity="0.95">
