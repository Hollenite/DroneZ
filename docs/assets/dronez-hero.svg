    <text x="949" y="310" fill="#102737" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Demo reward</text>
    <text x="949" y="340" fill="#2F80ED" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="900">32 → 89</text>
